name = "academy-manager1"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Non-sensitive environment variables.
# Secrets (set with `wrangler secret put <NAME>`):
#   TELEGRAM_BOT_TOKEN, API_SECRET_KEY, WEBHOOK_SECRET, ADMIN_CHAT_ID
[vars]
ENVIRONMENT = "production"
BOT_USERNAME = ""
# Tenant whitelist: the app sends X-Academy-Id; anything else is rejected.
ACADEMY_IDS = "default"
# Set after deploying to make signing links stable (defaults to the Worker origin).
PUBLIC_BASE_URL = "https://academy-manager1.wizard-tcman.workers.dev"
# Empty means SMS sending is disabled (a provider has not been chosen yet).
SMS_PROVIDER = ""
# Stage 9: the online payment gateway is COMPLETELY HIDDEN until you set
# this to "true" at deploy time. Any other value (or absence) keeps every
# /pay route, /api/payments/link, /api/payments/verify and all student-facing
# online hints safely blocked. Card-to-card + manager receipt approval are
# unaffected. Activation later ALSO requires a registered provider factory
# in code AND the manager's stored credentials.
ONLINE_PAYMENTS_ENABLED = "false"

# Stage 7 (server-side daily backup). All optional; free-tier safe defaults.
# How many VERIFIED healthy snapshots to keep per academy.
BACKUP_RETENTION_DAYS = "7"
# Above this compressed size, contract-file BYTES are summarized (hash+size)
# instead of stored, so one snapshot can never blow past the free D1 space.
BACKUP_MAX_BYTES = "26214400"
# Set "false" only for a deliberate metadata-only backup.
BACKUP_INCLUDE_FILES = "true"

# D1 relational DB (required): students, reminders, contracts, delivery status.
[[d1_databases]]
binding = "DB"
database_name = "academy-contracts-dev"
database_id = "2d7fa1bd-f015-43be-b180-1d7b84554ffd"
migrations_dir = "migrations"

# R2 bucket for contract PDFs. Requires R2 to be enabled once in the dashboard
# (Cloudflare > R2 > Enable). Without it, PDFs are stored in D1 instead.
# [[r2_buckets]]
# binding = "CONTRACTS"
# bucket_name = "academy-contracts"

# KV cache (optional, speeds up student lookup by chat id)
# [[kv_namespaces]]
# binding = "STUDENT_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"

# Background reminder dispatch. Every minute, so the reminder time set in the
# app ("10:00") is honored within ~1 minute even with the app closed.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
