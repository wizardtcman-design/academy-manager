name: Build APK

# Every push to main builds a signed installable APK and publishes it as a
# GitHub Release, so a new version no longer depends on the AI Studio builder.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore for AI-Studio signing config
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Unit tests (pure JVM)
        run: gradle testDebugUnitTest --tests "com.example.ValidationUtilTest" --tests "com.example.CredentialHasherTest" --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=${{ github.run_number }}
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$CODE" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/AcademyManager-v${{ steps.ver.outputs.name }}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AcademyManager-APK
          path: out/*.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: نسخه ${{ steps.ver.outputs.name }} (بیلد ${{ github.run_number }})
          body: |
            ساخت خودکار APK از آخرین کد شاخه main.
            نصب: فایل APK را دانلود و روی گوشی اندروید نصب کنید.
          files: out/*.apk
          generate_release_notes: true
