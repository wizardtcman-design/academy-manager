name: Build APK

# Every push to main builds a signed installable APK and publishes it as a
# GitHub Release, so a new version no longer depends on the AI Studio builder.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          CMDLINE="$RUNNER_TEMP/cmdline-tools"
          curl -sSLo "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          mkdir -p "$CMDLINE" "$SDK"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$CMDLINE"
          mv "$CMDLINE/cmdline-tools" "$CMDLINE/latest"
          yes | "$CMDLINE/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$CMDLINE/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CMDLINE/latest/bin" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > academy-release.p12

      - name: Create debug keystore for AI-Studio signing config
        run: |
          rm -f debug.keystore
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Unit tests (pure JVM)
        run: gradle testDebugUnitTest --tests "com.example.ValidationUtilTest" --tests "com.example.CredentialHasherTest" --stacktrace

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: upload
          KEYSTORE_PATH: ${{ github.workspace }}/academy-release.p12
        run: gradle assembleRelease --stacktrace

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=${{ github.run_number }}
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$CODE" >> $GITHUB_OUTPUT

      - name: Collect changelog for this version
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.name }}"
          if [ ! -f CHANGELOG.md ]; then echo "missing CHANGELOG.md" && exit 1; fi
          SECTION=$(awk -v v="$VERSION" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for version $VERSION" && exit 1
          fi
          {
            echo "### تغییرات نسخه $VERSION"
            echo
            printf '%s\n' "$SECTION"
            echo
            echo "---"
            echo "**نصب:** فایل APK را دانلود و روی گوشی اندروید نصب کنید."
            echo "اگر نسخه‌ای که با AI Studio ساخته شده نصب است، یک بار حذف و"
            echo "این نسخه را نصب کنید؛ از این به بعد آپدیت‌ها عادی نصب می‌شوند."
          } > release-notes.md
          cat release-notes.md

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/AcademyManager-v${{ steps.ver.outputs.name }}.apk"
          sha256sum out/*.apk | tee out/SHA256.txt

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          "$APKSIGNER" verify --print-certs out/*.apk | head -20

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: نسخه ${{ steps.ver.outputs.name }} (بیلد ${{ github.run_number }})
          body_path: release-notes.md
          files: |
            out/*.apk
            out/SHA256.txt
          generate_release_notes: false
