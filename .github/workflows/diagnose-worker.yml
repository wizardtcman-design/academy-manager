name: "Diagnose Worker (read-only logs + schema)"

# Read-only evidence gathering for the test-data cleanup investigation.
# It queries Workers Logs (observability) and reads the D1 schema + ledger.
# It NEVER writes to D1, NEVER deploys, NEVER purges data.
# Deliberately NOT in the production-worker-deploy concurrency group.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-back window in hours (1-72)'
        default: '6'
        required: false

concurrency: diagnose-worker-read-only

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: cloudflare-telegram-backend
        run: npm ci

      - name: Query Worker Logs (read-only, redacted paths)
        working-directory: cloudflare-telegram-backend
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnose-worker-logs.mjs --hours "${{ github.event.inputs.hours || '6' }}" --service academy-manager1

      - name: test_cleanup report metadata (read-only, no PII)
        working-directory: cloudflare-telegram-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "== rows in academy_settings for test_cleanup (metadata only) =="
          npx wrangler d1 execute academy-contracts-dev --remote --json --command "SELECT key, updated_at_epoch, LENGTH(value) AS value_len, json_extract(value,'\$.mode') AS mode, json_extract(value,'\$.ranAtEpoch') AS ran_at, json_extract(value,'\$.deletedTotal') AS deleted_total, json_extract(value,'\$.remainingClean') AS remaining_clean FROM academy_settings WHERE key LIKE '%test_cleanup%'" 2>&1 | tail -60

      - name: D1 schema + migration ledger (read-only)
        working-directory: cloudflare-telegram-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "== tables on production D1 =="
          npx wrangler d1 execute academy-contracts-dev --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" 2>&1 | tail -100
          echo "== d1_migrations ledger =="
          npx wrangler d1 execute academy-contracts-dev --remote --json --command "SELECT id, name FROM d1_migrations ORDER BY id" 2>&1 | tail -60
          echo "== students columns =="
          npx wrangler d1 execute academy-contracts-dev --remote --json --command "PRAGMA table_info(students)" 2>&1 | tail -80
