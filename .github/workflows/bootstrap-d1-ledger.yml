name: Bootstrap D1 ledger (one-time, production D1 — manual only)

# دفتر مهاجرت‌ها (d1_migrations) روی دیتابیس تولیدی از قبل وجود نداشت؛
# بدون آن، «Deploy Worker» در گیتِ فهرست مهاجرت‌ها متوقف می‌شود (و درست است).
# این workflow فقط همان bootstrap مستند (docs/BACKUP_AND_MIGRATION_PLAN.md §5-A)
# را اجرا می‌کند: اول بررسی‌های فقط-خواندنی، بعد ساخت دفتر و ثبت شش مهاجرتِ
# از-قبل-اعمال‌شده. هیچ migration واقعی اینجا اجرا نمی‌شود؛ اجرای آن‌ها فقط
# در «Deploy Worker (production)» و بعد از پشتیبان‌گیری انجام می‌شود.
#
# Idempotent: اگر دفتر از قبل موجود باشد، چیزی تغییر نمی‌دهد و OK می‌دهد.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-telegram-backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve production D1 database name (same pin source as deploy)
        run: |
          curl -sSf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/academy-manager1/settings" \
            > "$RUNNER_TEMP/prod-settings.json"
          PROD_DB_ID="$(node scripts/preflight-bindings.mjs wrangler.toml "$RUNNER_TEMP/prod-settings.json" 2>/dev/null | sed -n 's/^PROD_DB_ID=//p' | head -1)"
          if [ -z "$PROD_DB_ID" ]; then
            # preflight exits non-zero on var mismatch; for THIS one-time run we
            # only need the live D1 id — read it directly from the settings JSON.
            PROD_DB_ID="$(node -e 'const s=require(process.env.RUNNER_TEMP+"/prod-settings.json");const b=(s.result?.bindings||[]).find(x=>x.type==="d1");if(!b)process.exit(1);console.log(b.id)')"
          fi
          if [ -z "$PROD_DB_ID" ]; then echo "FAIL: PROD_DB_ID خوانده نشد"; exit 1; fi
          echo "PROD_DB_ID=$PROD_DB_ID" >> "$GITHUB_ENV"
          RESP="$(curl -sSf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_DB_ID")"
          PROD_DB_NAME="$(printf '%s' "$RESP" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result.name)}catch(e){process.exit(1)}})')"
          if [ -z "$PROD_DB_NAME" ]; then echo "FAIL: نام دیتابیس تولیدی خوانده نشد"; exit 1; fi
          echo "PROD_DB_NAME=$PROD_DB_NAME" >> "$GITHUB_ENV"

      - name: Bootstrap the migration ledger (read-only checks → then write)
        run: node scripts/bootstrap-d1-ledger.mjs "$PROD_DB_NAME"

      - name: Show exactly which migrations remain pending (read-only)
        run: npx wrangler d1 migrations list "$PROD_DB_NAME" --remote || true
