name: Backup D1 (production) — manual, verified

# پشتیبان‌گیری درخواستی از دیتابیس تولیدی — بدون هیچ تغییر دیگری.
# خروجی: artifact «d1-backup-<run_number>» شامل اسکیما + داده (SQL).
# Fail-safe: اگر فایل خروجی فاقد CREATE TABLE باشد (مثلاً export اشتباهاً
# روی دیتابیس محلیِ خالی رانر اجرا شده باشد)، اجرا شکست می‌خورد و artifact
# ساخته نمی‌شود؛ پس همیشه یک بکاپِ معتبر یا هیچ‌چیز داریم، نه بکاپِ توخالی.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-worker-deploy
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-telegram-backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve production D1 database name (never trust wrangler.toml)
        run: |
          curl -sSf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/academy-manager1/settings" \
            > "$RUNNER_TEMP/prod-settings.json"
          PROD_DB_ID="$(node -e 'const s=require(process.env.RUNNER_TEMP+"/prod-settings.json");const b=(s.result?.bindings||[]).find(x=>x.type==="d1");if(!b)process.exit(1);console.log(b.id)')"
          if [ -z "$PROD_DB_ID" ]; then echo "FAIL: PROD_DB_ID خوانده نشد"; exit 1; fi
          RESP="$(curl -sSf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_DB_ID")"
          PROD_DB_NAME="$(printf '%s' "$RESP" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result.name)}catch(e){process.exit(1)}})')"
          if [ -z "$PROD_DB_NAME" ]; then echo "FAIL: نام دیتابیس تولیدی خوانده نشد"; exit 1; fi
          echo "PROD_DB_NAME=$PROD_DB_NAME" >> "$GITHUB_ENV"

      - name: Export production D1 (schema + data, --remote is mandatory)
        run: |
          npx wrangler d1 export "$PROD_DB_NAME" --remote --output="$RUNNER_TEMP/d1-backup.sql"
          ls -l "$RUNNER_TEMP/d1-backup.sql"
          TABLES="$(grep -c 'CREATE TABLE' "$RUNNER_TEMP/d1-backup.sql" || true)"
          ROWS="$(grep -c 'INSERT INTO' "$RUNNER_TEMP/d1-backup.sql" || true)"
          if [ "${TABLES:-0}" -lt 5 ]; then
            echo "FAIL: بکاپ فقط $TABLES جدول دارد؛ export محلی/ناقص است. اجرا شکست خورد."
            exit 1
          fi
          echo "OK: بکاپ واقعی تولیدی: $TABLES جدول، $ROWS دستور INSERT."

      - name: Upload verified backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_number }}
          path: ${{ runner.temp }}/d1-backup.sql
          retention-days: 90
          if-no-files-found: error
